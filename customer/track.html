<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=../track.html" />
  <title>Redirecting to Delivio Tracking</title>
</head>
<body>
  <p>Redirecting to <a href="../track.html">Delivio tracking</a>...</p>
  <script>
    const target = new URL('../track.html', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
