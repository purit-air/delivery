<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Shipment — Delivio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container admin-create-shell">
    <section class="admin-form-card">
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="../assets/logo.svg" alt="Delivio logo" class="brand-mark" />
          <div>
            <p class="eyebrow">Delivery operations</p>
            <h1>Create Shipment</h1>
          </div>
        </div>
        <a class="btn btn-outline" href="dashboard.html">Back to dashboard</a>
      </div>

      <div id="msg" class="form-message" role="status" aria-live="polite"></div>

      <form id="create-form" novalidate>
        <section class="form-section">
          <div class="section-header">
            <h2>Shipment Information</h2>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="tracking_number">Tracking Number <span class="required">*</span></label>
              <input id="tracking_number" name="tracking_number" placeholder="TRE-2026-0001-0001" inputmode="text" autocomplete="off" maxlength="19" required />
            </div>
            <div class="field">
              <label for="carrier">Carrier</label>
              <input id="carrier" name="carrier" placeholder="Delivio Express" />
            </div>
            <div class="field">
              <label for="service">Service</label>
              <input id="service" name="service" placeholder="Priority Ground" />
            </div>
            <div class="field">
              <label for="status">Status <span class="required">*</span></label>
              <select id="status" name="status" required>
                <option value="shipment_created">Shipment Created</option>
                <option value="picked_up">Picked Up</option>
                <option value="in_transit">In Transit</option>
                <option value="out_for_delivery">Out for Delivery</option>
                <option value="delivered">Delivered</option>
                <option value="exception">Exception</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="field">
              <label for="shipment_date">Shipment Date</label>
              <input id="shipment_date" name="shipment_date" type="date" />
            </div>
            <div class="field">
              <label for="estimated_delivery">Estimated Delivery</label>
              <input id="estimated_delivery" name="estimated_delivery" type="date" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-header">
            <h2>Sender</h2>
          </div>
          <div class="field-grid">
            <div class="field field-span-2">
              <label for="sender_name">Name <span class="required">*</span></label>
              <input id="sender_name" name="sender_name" required placeholder="Jordan Smith" />
            </div>
            <div class="field">
              <label for="sender_company">Company</label>
              <input id="sender_company" name="sender_company" placeholder="Acme Retail" />
            </div>
            <div class="field">
              <label for="sender_phone">Phone</label>
              <input id="sender_phone" name="sender_phone" type="tel" placeholder="+1 (555) 000-0000" />
            </div>
            <div class="field">
              <label for="sender_email">Email</label>
              <input id="sender_email" name="sender_email" type="email" placeholder="sender@example.com" />
            </div>
            <div class="field field-span-2">
              <label for="sender_address_line_1">Address Line 1</label>
              <input id="sender_address_line_1" name="sender_address_line_1" placeholder="123 Main Street" />
            </div>
            <div class="field">
              <label for="sender_address_line_2">Address Line 2</label>
              <input id="sender_address_line_2" name="sender_address_line_2" placeholder="Suite 100" />
            </div>
            <div class="field">
              <label for="sender_city">City</label>
              <input id="sender_city" name="sender_city" placeholder="Seattle" />
            </div>
            <div class="field">
              <label for="sender_state">State / Region</label>
              <input id="sender_state" name="sender_state" placeholder="WA" />
            </div>
            <div class="field">
              <label for="sender_postal_code">Postal Code</label>
              <input id="sender_postal_code" name="sender_postal_code" placeholder="98101" />
            </div>
            <div class="field">
              <label for="sender_country">Country</label>
              <input id="sender_country" name="sender_country" placeholder="USA" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-header">
            <h2>Recipient</h2>
          </div>
          <div class="field-grid">
            <div class="field field-span-2">
              <label for="recipient_name">Name <span class="required">*</span></label>
              <input id="recipient_name" name="recipient_name" required placeholder="Alex Jones" />
            </div>
            <div class="field">
              <label for="recipient_company">Company</label>
              <input id="recipient_company" name="recipient_company" placeholder="Northwind Labs" />
            </div>
            <div class="field">
              <label for="recipient_phone">Phone</label>
              <input id="recipient_phone" name="recipient_phone" type="tel" placeholder="+1 (555) 111-1111" />
            </div>
            <div class="field">
              <label for="recipient_email">Email</label>
              <input id="recipient_email" name="recipient_email" type="email" placeholder="recipient@example.com" />
            </div>
            <div class="field field-span-2">
              <label for="recipient_address_line_1">Address Line 1</label>
              <input id="recipient_address_line_1" name="recipient_address_line_1" placeholder="456 Market Street" />
            </div>
            <div class="field">
              <label for="recipient_address_line_2">Address Line 2</label>
              <input id="recipient_address_line_2" name="recipient_address_line_2" placeholder="Floor 5" />
            </div>
            <div class="field">
              <label for="recipient_city">City</label>
              <input id="recipient_city" name="recipient_city" placeholder="Austin" />
            </div>
            <div class="field">
              <label for="recipient_state">State / Region</label>
              <input id="recipient_state" name="recipient_state" placeholder="TX" />
            </div>
            <div class="field">
              <label for="recipient_postal_code">Postal Code</label>
              <input id="recipient_postal_code" name="recipient_postal_code" placeholder="78701" />
            </div>
            <div class="field">
              <label for="recipient_country">Country</label>
              <input id="recipient_country" name="recipient_country" placeholder="USA" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-header">
            <h2>Package</h2>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="package_type">Package Type</label>
              <input id="package_type" name="package_type" placeholder="Box" />
            </div>
            <div class="field field-span-2">
              <label for="package_description">Description</label>
              <input id="package_description" name="package_description" placeholder="Electronics shipment" />
            </div>
            <div class="field">
              <label for="quantity">Quantity</label>
              <input id="quantity" name="quantity" type="number" min="1" step="1" placeholder="1" />
            </div>
            <div class="field">
              <label for="weight_kg">Weight (kg)</label>
              <input id="weight_kg" name="weight_kg" type="number" min="0" step="0.1" placeholder="2.5" />
            </div>
            <div class="field">
              <label for="length_cm">Length (cm)</label>
              <input id="length_cm" name="length_cm" type="number" min="0" step="0.1" placeholder="30" />
            </div>
            <div class="field">
              <label for="width_cm">Width (cm)</label>
              <input id="width_cm" name="width_cm" type="number" min="0" step="0.1" placeholder="20" />
            </div>
            <div class="field">
              <label for="height_cm">Height (cm)</label>
              <input id="height_cm" name="height_cm" type="number" min="0" step="0.1" placeholder="15" />
            </div>
            <div class="field">
              <label for="declared_value">Declared Value</label>
              <input id="declared_value" name="declared_value" type="number" min="0" step="0.01" placeholder="199.99" />
            </div>
            <div class="field field-span-2">
              <label for="special_instructions">Special Instructions</label>
              <textarea id="special_instructions" name="special_instructions" rows="3" placeholder="Fragile, leave at front desk, etc."></textarea>
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-header">
            <h2>Route</h2>
          </div>
          <div class="field-grid route-grid">
            <div class="field">
              <label for="origin">Origin <span class="required">*</span></label>
              <input id="origin" name="origin" required placeholder="Seattle, WA" />
            </div>
            <div class="field">
              <label for="destination">Destination <span class="required">*</span></label>
              <input id="destination" name="destination" required placeholder="Austin, TX" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-header">
            <h2>Initial Tracking Event</h2>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="event_location">Event Location</label>
              <input id="event_location" name="event_location" placeholder="Seattle Distribution Center" />
            </div>
            <div class="field field-span-2">
              <label for="event_description">Event Description</label>
              <input id="event_description" name="event_description" placeholder="Shipment Created" />
            </div>
          </div>
        </section>

        <div class="submit-row">
          <button class="btn btn-primary" type="submit">Create Shipment</button>
          <a class="btn btn-outline" href="dashboard.html">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
